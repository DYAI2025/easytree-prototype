services:
  db:
    image: postgres:17-alpine
    container_name: easytree-prototype-db
    environment:
      POSTGRES_PASSWORD: easytree
      POSTGRES_DB: easytree_prototype
    ports:
      - "55432:5432"
    volumes:
      - easytree_pg_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easytree_prototype"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  easytree_pg_data:
