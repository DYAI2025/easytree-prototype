name: CI

on:
  push:
  pull_request:

# github.ref unterscheidet sich zwischen push (refs/heads/x) und pull_request
# (refs/pull/n/merge). Ohne head_ref liefen bei offenem PR alle Jobs doppelt.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm MUSS vor setup-node laufen: cache: pnpm ruft "pnpm store path" auf
      # und braucht pnpm bereits im PATH. Ohne "version" liest pnpm/action-setup
      # das Feld packageManager (pnpm@10.28.0) aus package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit (vitest domain + ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration (vitest + postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: easytree
          POSTGRES_DB: easytree_prototype
        # Der Job laeuft auf dem Runner, nicht im Container: Port mappen, Host 127.0.0.1.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype
      DATABASE_URL_TEST: postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service-Container starten VOR actions/checkout, deshalb kann
      # ./docker/initdb nicht gemountet werden und die Testdatenbank aus
      # docker-compose.yml entsteht hier nicht. psql ist auf ubuntu-latest
      # vorinstalliert.
      - name: Testdatenbank anlegen
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database easytree_prototype_test'
      # Kein separater Migrationsschritt noetig: tests/integration/global-setup.ts
      # setzt das Schema zurueck und migriert einmal pro Lauf gegen
      # DATABASE_URL_TEST. Der urspruenglich vorgemerkte "pnpm db:migrate"
      # haette die falsche Datenbank migriert (DATABASE_URL statt _TEST) und
      # waere ohne .env.local mit Node-Exit 9 abgebrochen.
      - run: pnpm test:integration

  e2e:
    name: e2e (playwright chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: easytree
          POSTGRES_DB: easytree_prototype
        # Der Job laeuft auf dem Runner, nicht im Container: Port mappen, Host 127.0.0.1.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EASYTREE_FIXED_TODAY: "2026-09-01"
      DATABASE_URL: postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # .env.local ist Pflicht, nicht Komfort: db:reset und db:seed laufen ueber
      # `node --env-file=.env.local` und brechen ohne die Datei mit Exit 9 ab.
      # Der Playwright-globalSetup ruft genau diese beiden Skripte auf.
      # Nur nicht-geheime lokale Defaults, wie in .env.example.
      - name: .env.local fuer die Datenbankskripte schreiben
        run: |
          cat > .env.local <<'ENVEOF'
          DATABASE_URL=postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype
          DATABASE_URL_TEST=postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype_test
          GEOCODER_PROVIDER=manual
          GEOCODER_BASE_URL=
          GEOCODER_USER_AGENT=
          GEOCODER_ALLOW_FIXTURE=
          EASYTREE_FIXED_TODAY=
          ENVEOF
      # Kein db:migrate-Schritt: e2e/fixtures/seed-helper.ts laeuft als
      # Playwright-globalSetup und macht einmal pro Lauf db:reset (drop, create,
      # migrate) plus db:seed.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # git grep endet bei KEINEM Treffer mit Exit 1 - deshalb die invertierte
      # if-Konstruktion und kein "|| exit 1".
      # [[:space:]] statt \s: portabel (macOS-git liest \s als literales "s").
      # Kein -i: sonst meldet POSTGRES_PASSWORD=easytree im Planungsdokument.
      # {8,}: der WERT muss wie ein Geheimnis aussehen, sonst schlaegt jeder
      # gewoehnliche Bezeichner wie `const password = "..."` als Fehlalarm an.
      - name: Nach Klartext-Geheimnissen suchen
        run: |
          if git grep -nE '(api[_-]?key|secret|password)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9_./+-]{8,}' -- . ':!*.example'; then
            echo 'Treffer'
            exit 1
          fi
