name: CI

on:
  push:
  pull_request:

# github.ref unterscheidet sich zwischen push (refs/heads/x) und pull_request
# (refs/pull/n/merge). Ohne head_ref liefen bei offenem PR alle Jobs doppelt.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (format, lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm MUSS vor setup-node laufen: cache: pnpm ruft "pnpm store path" auf
      # und braucht pnpm bereits im PATH. Ohne "version" liest pnpm/action-setup
      # das Feld packageManager (pnpm@10.28.0) aus package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit (vitest domain + ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration (vitest + postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: easytree
          POSTGRES_DB: easytree_prototype
        # Der Job laeuft auf dem Runner, nicht im Container: Port mappen, Host 127.0.0.1.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype
      DATABASE_URL_TEST: postgres://postgres:easytree@127.0.0.1:5432/easytree_prototype_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Service-Container starten VOR actions/checkout, deshalb kann
      # ./docker/initdb nicht gemountet werden und die Testdatenbank aus
      # docker-compose.yml entsteht hier nicht. psql ist auf ubuntu-latest
      # vorinstalliert.
      - name: Testdatenbank anlegen
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database easytree_prototype_test'
      # Kein separater Migrationsschritt noetig: tests/integration/global-setup.ts
      # setzt das Schema zurueck und migriert einmal pro Lauf gegen
      # DATABASE_URL_TEST. Der urspruenglich vorgemerkte "pnpm db:migrate"
      # haette die falsche Datenbank migriert (DATABASE_URL statt _TEST) und
      # waere ohne .env.local mit Node-Exit 9 abgebrochen.
      - run: pnpm test:integration

  e2e:
    name: e2e (playwright chromium)
    # runs-on bleibt: Job- und Service-Container brauchen einen Linux-Runner als Host.
    runs-on: ubuntu-latest
    # EYT-172A: E2E laeuft im selben versionsgepinnten Playwright-Image-Tag, in
    # dem die *-linux.png-Baselines erzeugt werden. Direkt auf ubuntu-latest
    # rendert system-ui mit DejaVu Sans (Ink-Breiten im CI-Run 34598711500), das
    # Image hat kein DejaVu (fc-list: Liberation, FreeSans, WenQuanYi) - beides
    # gemessen am 11.09.2026. Browser, OS-Bibliotheken und Fonts kommen allein
    # aus dem Image. Gleicher Tag heisst nicht gleiches Binary: ubuntu-latest
    # zieht das linux/amd64-Manifest, lokal auf Apple Silicon entsteht
    # linux/arm64. Die Tag-Version MUSS @playwright/test in package.json folgen.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: easytree
          POSTGRES_DB: easytree_prototype
        # Der Job laeuft im Container: der Service ist im Job-Netzwerk ueber
        # seinen Namen "postgres" erreichbar, ein Port-Mapping entfaellt.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EASYTREE_FIXED_TODAY: "2026-09-01"
      DATABASE_URL: postgres://postgres:easytree@postgres:5432/easytree_prototype
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # setup-node bleibt auch im Container: das Image bringt Node 24 mit,
      # package.json verlangt ">=22 <23" (.nvmrc).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Kein "playwright install --with-deps": Chromium und Headless Shell
      # (Revision 1243, wie browsers.json von playwright-core 1.63.0) liegen
      # samt Bibliotheken schon im Image unter PLAYWRIGHT_BROWSERS_PATH=/ms-playwright.
      # "--with-deps" ruft apt-get auf und kann damit Pakete und Fonts genau der
      # Umgebung anheben, die hier kanonisch sein soll.
      # Nur lesend: haelt Architektur, Node, Font-Aufloesung und
      # Browser-Revisionen des tatsaechlichen Laufs im Log fest.
      - name: Render-Umgebung protokollieren
        run: |
          uname -m
          node --version
          fc-match system-ui
          fc-match sans-serif
          ls /ms-playwright
      # .env.local ist Pflicht, nicht Komfort: db:reset und db:seed laufen ueber
      # `node --env-file=.env.local` und brechen ohne die Datei mit Exit 9 ab.
      # Der Playwright-globalSetup ruft genau diese beiden Skripte auf.
      # Nur nicht-geheime lokale Defaults, wie in .env.example.
      #
      # GEOCODER_PROVIDER steht hier bewusst auf manual und WIDERSPRICHT NICHT
      # dem fixture-Wert in playwright.config.ts: webServer.env landet direkt in
      # process.env des gestarteten Servers, und Next ueberschreibt vorhandene
      # Prozessvariablen nicht mit .env-Dateien. Gemessen am 08.09.2026 lokal -
      # .env.local sagte manual, der Lauf sah trotzdem die Fixture-Kandidaten.
      # Diese Datei hier versorgt db:reset und db:seed, nicht den Webserver.
      - name: .env.local fuer die Datenbankskripte schreiben
        run: |
          cat > .env.local <<'ENVEOF'
          DATABASE_URL=postgres://postgres:easytree@postgres:5432/easytree_prototype
          DATABASE_URL_TEST=postgres://postgres:easytree@postgres:5432/easytree_prototype_test
          GEOCODER_PROVIDER=manual
          GEOCODER_BASE_URL=
          GEOCODER_USER_AGENT=
          GEOCODER_ALLOW_FIXTURE=
          EASYTREE_FIXED_TODAY=
          ENVEOF
      # Kein db:migrate-Schritt: e2e/fixtures/seed-helper.ts laeuft als
      # Playwright-globalSetup und macht einmal pro Lauf db:reset (drop, create,
      # migrate) plus db:seed.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # git grep endet bei KEINEM Treffer mit Exit 1 - deshalb die invertierte
      # if-Konstruktion und kein "|| exit 1".
      # [[:space:]] statt \s: portabel (macOS-git liest \s als literales "s").
      # Kein -i: sonst meldet POSTGRES_PASSWORD=easytree im Planungsdokument.
      # {8,}: der WERT muss wie ein Geheimnis aussehen, sonst schlaegt jeder
      # gewoehnliche Bezeichner wie `const password = "..."` als Fehlalarm an.
      - name: Nach Klartext-Geheimnissen suchen
        run: |
          if git grep -nE '(api[_-]?key|secret|password)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9_./+-]{8,}' -- . ':!*.example'; then
            echo 'Treffer'
            exit 1
          fi
